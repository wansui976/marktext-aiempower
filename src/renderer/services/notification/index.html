<div class="mt-notification">
  <div class="notice-bg"></div>
  <div class="fluent-container">
    <div class="fluent"></div>
  </div>
  <div class="content">
    <div class="title">
      <div class="icon-wrapper">{{icon}}</div>
      <span>{{title}}</span>
      <svg class="lucide close" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
    </div>
    <div class="body">
      <div class="left-text">{{message}}</div>
      <div class="confirm">
        <svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></svg>
      </div>
    </div>
  </div>
</div>
